name: Fetch public App Store reviews

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/fetch-appstore.yml
      - scripts/fetch-appstore.mjs
  workflow_dispatch:
    inputs:
      date:
        description: Date in ICT, YYYY-MM-DD
        required: true
        default: "2026-10-12"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Fetch and sanitize public reviews
        env:
          TARGET_DATE: ${{ inputs.date || '2026-10-12' }}
        run: node scripts/fetch-appstore.mjs "$TARGET_DATE"
      - name: Commit sanitized staging data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add run-artifacts/
          if git diff --cached --quiet; then
            echo "No staging changes"
          else
            git commit -m "Fetch sanitized App Store reviews for 2026-10-12 [skip ci]"
            git push
          fi
